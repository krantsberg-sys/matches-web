<script>
const D=[63,6,91,79,102,109,125,7,127,111],OPS={1:'-',3:'+'},NEED=100,PRICE='₪7.90',PACK='₪19.90',KEEP='₪7.90';
const TI=[null,{n:'קל',N:[1,1,1],k:1,a:[0,9],b:[0,9]},{n:'בינוני',N:[2,1,2],k:1,a:[10,99],b:[1,9]},{n:'קשה',N:[2,2,2],k:1,a:[10,99],b:[10,99]},{n:'מומחה',N:[2,2,2],k:2,a:[10,99],b:[10,99]}];
function num(m,f,n){let v=0;for(let i=0;i<n;i++){const d=D.indexOf(m[f+i]);if(d<0)return -1;v=v*10+d}if(n>1&&D.indexOf(m[f])==0)return -1;return v}
function dec(m,N){const a=num(m,0,N[0]),b=num(m,N[0]+1,N[1]),c=num(m,N[0]+1+N[1],N[2]),o=OPS[m[N[0]]];return(a<0||b<0||c<0||!o)?null:[a,o,b,c]}
const ok=(m,N)=>{const d=dec(m,N);return !!d&&(d[1]=='+'?d[0]+d[2]:d[0]-d[2])==d[3]};
const slots=N=>[...Array(N[0]).fill(7),2,...Array(N[1]).fill(7),...Array(N[2]).fill(7)];
function moves(m,N,sl,strict){const out=[];for(let i=0;i<sl.length;i++)for(let s=0;s<sl[i];s++)if(m[i]>>s&1){const r=m.slice();r[i]^=1<<s;
for(let j=0;j<sl.length;j++)for(let t=0;t<sl[j];t++)if(!(r[j]>>t&1)&&!(i==j&&s==t)){const q=r.slice();q[j]|=1<<t;if(!strict||(dec(q,N)&&!ok(q,N)))out.push({q,pick:[j,t],put:[i,s]})}}return out}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ri=(r,x)=>x[0]+(r()*(x[1]-x[0]+1)|0),dg=(v,n)=>String(v).padStart(n,'0').split('').map(x=>D[+x]);
function make(t,n){const T=TI[t],N=T.N,sl=slots(N),r=rng(t*100003+n*7919+13);
for(;;){const a=ri(r,T.a),b=ri(r,T.b),p=r()<.5,c=p?a+b:a-b;if(c<0||c>10**N[2]-1||(N[2]>1&&c<10))continue;
const m=[...dg(a,N[0]),p?3:1,...dg(b,N[1]),...dg(c,N[2])],mv=moves(m,N,sl,T.k==1);if(!mv.length)continue;const x=mv[r()*mv.length|0];
if(T.k==2){const m2=moves(x.q,N,sl,true);if(!m2.length)continue;const y=m2[r()*m2.length|0];return{q:y.q,pick:y.pick,put:y.put,N,sl,k:2}}
return{q:x.q,pick:x.pick,put:x.put,N,sl,k:1}}}
//UI
const G=[[10,8,40,8],[52,12,8,44],[52,64,8,44],[10,104,40,8],[0,64,8,44],[0,12,8,44],[10,56,40,8]],GO=[[10,56,40,8],[26,34,8,52]];
const $=id=>document.getElementById(id);
let AC;function snd(ok){if(S.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();
const n=ok?[[523,0],[659,.1],[784,.2],[1047,.3]]:[[220,0],[165,.16]];
n.forEach(([f,t])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'triangle':'sawtooth';o.frequency.value=f;o.connect(g);g.connect(AC.destination);
const a=AC.currentTime+t;g.gain.setValueAtTime(.0001,a);g.gain.exponentialRampToValueAtTime(.18,a+.02);g.gain.exponentialRampToValueAtTime(.0001,a+(ok?.25:.3));o.start(a);o.stop(a+.32)})}catch(e){}}
const ds=o=>{const d=new Date();d.setDate(d.getDate()+o);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
let S={t:1,ln:{1:1,2:1,3:1,4:1},prog:{1:0,2:0,3:0,4:0},paid:{},solved:{},cdone:{},freeze:0,hints:3,done:0,lastAd:0,streak:0,last:'',today:'',cnt:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('nz1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('nz1',JSON.stringify(S))}catch(e){}};
const stk=()=>(S.last==ds(0)||S.last==ds(-1))?S.streak:0;
const dd=s=>{const[y,m,d]=s.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
const missed=()=>S.last?Math.max(0,dd(ds(0))-dd(S.last)-1):0;
const canRescue=()=>S.streak>0&&missed()>0&&missed()<=7;
function settle(){const g=missed();if(S.streak>0&&g>0){if(g<=(S.freeze||0)){S.freeze-=g;S.last=ds(-1);S.note='❄ נוצלו '+g+' ימי חופשה והרצף נשמר'}else if(g>7)S.streak=0;save()}}
const cnt=()=>S.today==ds(0)?S.cnt:0;
const tmp=t=>!!S.tmp&&S.tmp[t]>Date.now();
const unl=t=>t==1||!!S.pack||!!S.paid[t]||S.prog[t-1]>=NEED||tmp(t);
let L,cur,held,lock,hintOn,mv=0;
const DAILY=10,TOT={1:625,2:20678,3:115786},POOL={},SS={};
const key=q=>q.map(v=>v.toString(16).padStart(2,'0')).join('');
const ssOf=t=>SS[t]||(SS[t]=new Set((S.solved&&S.solved[t])||[]));
function pool(t){if(!POOL[t]){const T=TI[t],N=T.N,sl=slots(N),P=new Map();
for(let a=T.a[0];a<=T.a[1];a++)for(let b=T.b[0];b<=T.b[1];b++)for(const p of[1,0]){const c=p?a+b:a-b;if(c<0||c>10**N[2]-1||(N[2]>1&&c<10))continue;
const m=[...dg(a,N[0]),p?3:1,...dg(b,N[1]),...dg(c,N[2])];for(const x of moves(m,N,sl,true)){const k=key(x.q);if(!P.has(k))P.set(k,{q:x.q,pick:x.pick,put:x.put,N,sl,k:1})}}
POOL[t]=[...P.values()]}return POOL[t]}
function pickFree(t,n){const ss=ssOf(t),free=pool(t).filter(x=>!ss.has(key(x.q)));if(!free.length)return null;return free[rng(t*100003+n*7919+13)()*free.length|0]}
function pickPuzzle(t,n){if(t<=2)return pickFree(t,n);const ss=ssOf(t);
for(let a=0;a<300;a++){const P=make(t,n+a*100000);if(!ss.has(key(P.q)))return P}
return t==3?pickFree(3,n):make(t,n)}
function showDone(){lock=true;const t=S.t;
$('lkb').innerHTML='<div style="font-size:40px">🏆</div><b>כל הכבוד! רמת “'+TI[t].n+'” הושלמה</b><div>פתרת את כל החידות ברמה הזו.</div>'+(t<4?'<button class="pri" id="dn">לרמה הבאה: “'+TI[t+1].n+'”</button>':'')+'<button id="dr">שחק את הרמה שוב מההתחלה</button>';
$('lk').classList.add('on');
if($('dn'))$('dn').onclick=()=>{$('lk').classList.remove('on');S.t=t+1;save();load()};
$('dr').onclick=()=>{$('lk').classList.remove('on');S.solved[t]=[];SS[t]=new Set();save();load()}}
function load(){settle();if(S.hday!=ds(0)){S.hday=ds(0);S.hints=3;save()}if(!unl(S.t))S.t=1;const L2=pickPuzzle(S.t,S.ln[S.t]);if(!L2){tiers();showDone();return}L=L2;cur=L.q.slice();held=null;lock=false;hintOn=false;mv=0;
$('lv').textContent=S.ln[S.t];$('sb').textContent=L.k==2?'הזז שני גפרורים כדי שהמשוואה תהיה נכונה':'הזז גפרור אחד כדי שהמשוואה תהיה נכונה';
const cr=canRescue();$('st').textContent='🔥 '+(cr?S.streak+' ⚠':stk())+' ❄'+(S.freeze||0);$('bz').style.display=cr?'':'none';
const c=cnt();$('dp').textContent='היעד היום: '+Math.min(c,DAILY)+'/'+DAILY+(c>=DAILY?' ✓':'');$('pf').style.width=Math.min(c,DAILY)/DAILY*100+'%';$('pf').parentNode.classList.toggle('done',c>=DAILY);
document.querySelector('.ad').style.display=S.pack?'none':'';$('msg').textContent=S.note||'';S.note='';$('bh').textContent='💡 רמז ('+(S.hints>0?S.hints:'פרסומת')+')';tiers();render()}
function tiers(){$('tr').innerHTML=[1,2,3,4].map(t=>'<button class="t'+(S.t==t?' on':'')+'" data-t="'+t+'">'+TI[t].n+'<br><small>'+(unl(t)?(S.cdone[t]?'🏆 ':'')+(tmp(t)&&!S.paid[t]&&S.prog[t-1]<NEED?'⏳ עד '+(S.tmp[t]-Date.now()>9e7?new Date(S.tmp[t]).toLocaleDateString('he-IL',{day:'numeric',month:'numeric'}):'חצות'):(t<4&&!unl(t+1)?S.prog[t]+'/'+NEED:S.prog[t]+' נפתרו')):'🔒')+'</small></button>').join('')}
